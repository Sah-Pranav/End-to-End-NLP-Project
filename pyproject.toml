[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-and-dialogue-summarizer"
version = "0.1.0"
description = "Production-oriented text summarization system with fine-tuning, evaluation, and API inference."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Pranav Sah" }
]
dependencies = [
    "datasets",
    "evaluate",
    "peft==0.20.0",
    "pyyaml",
    "rouge-score",
    "torch",
    "transformers==5.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]
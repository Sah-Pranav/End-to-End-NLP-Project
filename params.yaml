data:
  max_train_samples: null
  max_validation_samples: null
  max_test_samples: null
  development_mode: false
  seed: 42
  development_train_samples: 1000
  development_validation_samples: 200
  development_test_samples: 200
tokenization:
  max_input_length: 512
  max_target_length: 64
training:
  learning_rate: 0.0002
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  weight_decay: 0.01
  warmup_ratio: 0.05
  logging_steps: 50
  save_strategy: epoch
  eval_strategy: epoch
  fp16: false
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
  - q
  - v
generation:
  max_new_tokens: 64
  num_beams: 4
  do_sample: false
  length_penalty: 1.0
  no_repeat_ngram_size: 3
evaluation:
  batch_size: 2
  max_samples: null
